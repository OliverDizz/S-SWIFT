# scripts/kinetics_prompts.yaml
#
# SAM3 noun-concept prompts per Kinetics-400 action label.
#
# SAM3 ("Segment Anything with Concepts") segments NOUN concepts (e.g.
# "person", "guitar", "sheep"). It does not understand action/verb phrases, so a
# Kinetics label such as "playing guitar" is not a valid text prompt.
#
# Policy: include the actor plus the primary object(s)/equipment the action
# targets or manipulates. Keep lists short (2-3) so the ROI stays on the salient
# subject rather than the whole scene. Ambient background (water, snow, sky) is
# usually omitted unless it is the action's target (e.g. cleaning floor). A few
# actions have no clear object and use the actor only. Underwater/fishing
# actions also include "fish" because it is typically present.
#
# Labels not listed here fall back to ["person"] in the mask script.

